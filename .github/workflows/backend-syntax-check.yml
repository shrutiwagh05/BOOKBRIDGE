name: Backend syntax checks

on:
  push:
    branches:
      - rebuild/reliable-final-submission
    paths:
      - "server/**"
      - ".github/workflows/backend-syntax-check.yml"
  pull_request:
    branches:
      - integration-demo
      - feat/password-reset-flow
    paths:
      - "server/**"
      - ".github/workflows/backend-syntax-check.yml"
  workflow_dispatch:

jobs:
  backend-syntax:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Install backend dependencies
        run: npm ci
      - name: Check JavaScript syntax
        run: find src test -type f -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Run backend unit tests
        run: npm test
