name: Frontend build check
# Keep the final-submission branch buildable before any integration or deployment.

on:
  push:
    branches:
      - rebuild/reliable-final-submission
    paths:
      - "client/**"
      - ".github/workflows/frontend-build-check.yml"
  pull_request:
    branches:
      - integration-demo
    paths:
      - "client/**"
      - ".github/workflows/frontend-build-check.yml"
  workflow_dispatch:

jobs:
  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Build frontend
        run: npm run build
